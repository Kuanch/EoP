<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eye of Providence</title>
    <link rel="stylesheet" href="/static/css/dashboard.css?v=6">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>.dark-tooltip { background: #16213e; color: #e0e0e0; border: 1px solid #2a2a4a; } .dark-tooltip .leaflet-tooltip-arrow { display: none; }</style>
</head>
<body>
    <nav class="navbar">
        <div class="brand">
            <span class="eye">&#9651;</span>
            <span>Eye of Providence</span>
        </div>
        <div class="right">
            <span id="ws-status" class="ws-status" title="WebSocket status"></span>
            <span class="username">{{ username }}</span>
            <form method="POST" action="/logout" style="display:inline;margin:0;"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button type="submit" class="logout-btn" style="background:none;border:none;cursor:pointer;">Logout</button></form>
        </div>
    </nav>

    <div class="tab-bar">
        <button class="tab-btn active" data-tab="news">News <span class="health-dot" data-source="news" title="News"></span></button>
        <button class="tab-btn" data-tab="markets">Markets <span class="health-dot" data-source="markets" title="Markets"></span> <span class="health-dot" data-source="polymarket" title="Polymarket"></span></button>
        <button class="tab-btn" data-tab="military">Military <span class="health-dot" data-source="military" title="Military"></span></button>
        <button class="tab-btn" data-tab="cyber">Cyber <span class="health-dot" data-source="cyber" title="Cyber"></span></button>
        <button class="tab-btn" data-tab="map">Map <span class="health-dot" data-source="ships" title="Ships"></span> <span class="health-dot" data-source="pizzint" title="PizzINT"></span></button>
        <button class="tab-btn" data-tab="threats">Threats</button>
    </div>

    {% block content %}{% endblock %}

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="/static/js/dashboard.js?v=2"></script>
    <script src="/static/js/ws.js?v=2"></script>
    <script src="/static/js/news.js?v=2"></script>
    <script src="/static/js/markets.js?v=8"></script>
    <script src="/static/js/military.js?v=2"></script>
    <script src="/static/js/cyber.js?v=2"></script>
    <script src="/static/js/map.js?v=10"></script>
    <script src="/static/js/threats.js?v=2"></script>
</body>
</html>
